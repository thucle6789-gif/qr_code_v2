name: Auto Reboot Streamlit App

on:
  schedule:
    - cron: '0 23 * * *'  # 6:00 AM GMT+7
  workflow_dispatch:

jobs:
  reboot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Push empty commit to trigger redeploy
        run: |
          git config user.name "Auto Reboot"
          git config user.email "reboot@auto.com"
          git fetch origin main
          git reset --hard origin/main
          git commit --allow-empty -m "chore: auto reboot $(date '+%Y-%m-%d %H:%M')"
          git push origin main
