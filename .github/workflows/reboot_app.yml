# File: .github/workflows/reboot_app.yml
# Tự động reboot bằng cách push commit rỗng mỗi ngày 6:00 sáng GMT+7

name: Auto Reboot Streamlit App

on:
  schedule:
    - cron: '0 23 * * *'  # 6:00 AM GMT+7 = 23:00 UTC hôm trước
  workflow_dispatch:        # Cho phép chạy thủ công

jobs:
  reboot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push empty commit to trigger redeploy
        run: |
          git config user.name "Auto Reboot"
          git config user.email "reboot@auto.com"
          git commit --allow-empty -m "chore: auto reboot $(date '+%Y-%m-%d %H:%M')"
          git push
