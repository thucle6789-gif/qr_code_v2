name: Auto Reboot Streamlit App

on:
  schedule:
    - cron: '0 23 * * *'  # 6:00 AM GMT+7
  workflow_dispatch:

jobs:
  reboot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Touch requirements.txt to trigger redeploy
        run: |
          git config user.name "Auto Reboot"
          git config user.email "reboot@auto.com"
          # Thêm/xóa dòng trống cuối file để tạo thay đổi thật
          echo "" >> requirements.txt
          git add requirements.txt
          git commit -m "chore: auto reboot $(date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:main
